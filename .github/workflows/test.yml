name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks escanea el historial completo, no solo el último
          # commit -- un secreto que se coló y se "borró" en un commit
          # posterior sigue estando en el historial de git.
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Auditoría de dependencias (pip-audit)
        run: pip-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check inyector/ tests/

      - name: Type-check (mypy)
        run: mypy inyector/

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests unitarios
        run: pytest tests/ --ignore=tests/integration -v

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar pytest
        run: pip install pytest==9.0.3

      - name: Build de la imagen inyector
        run: docker compose build

      - name: Correr test de integración contra lab vulnerable real
        run: pytest tests/integration/ -v
